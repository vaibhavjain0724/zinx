<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zinx</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <h1>Zinx</h1>
        <a href="./docs.html" class="docs-link">
            Documentation
        </a>

        <div class="editor">
            <input
                type="text"
                id="code"
                placeholder="Enter Zinx code"
            >

            <button id="run">Run</button>
        </div>

        <div class="panel output-panel">
            <h2>Output</h2>
            <pre id="output"></pre>
        </div>

        <div class="debug-panels">

            <div class="panel">
                <h2>Tokens</h2>
                <pre id="tokens"></pre>
            </div>

            <div class="panel">
                <h2>AST</h2>
                <pre id="ast"></pre>
            </div>

        </div>

    </div>

    <script type="module" src="./app.js"></script>

</body>
</html>
