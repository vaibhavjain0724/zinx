name: Deploy to S3

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 cp index.html s3://${{ secrets.S3_BUCKET }}/index.html
          aws s3 cp app.js s3://${{ secrets.S3_BUCKET }}/app.js
          aws s3 cp docs.html s3://${{ secrets.S3_BUCKET }}/docs.html
          aws s3 cp style.css s3://${{ secrets.S3_BUCKET }}/style.css
          aws s3 sync ./src s3://${{ secrets.S3_BUCKET }}/src --delete