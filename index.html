<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zinx</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1>Zinx</h1>

    <div class="toolbar-section">
        <h2>History</h2>

        <div class="history-buttons">
            <button id="prevButton">Previous</button>
            <button id="nextButton">Next</button>
            <button id="recentButton">Most Recent Code</button>
            <button id="deleteHis">Clear History</button>
        </div>
    </div>

    <div class="toolbar-section documentation-section">
        <h2>Documentation</h2>

        <a href="./docs.html" class="docs-link">
            Documentation
        </a>
    </div>
    <!-- <div class="editor">
        <textarea id="code" placeholder="Enter Zinx code"></textarea>

        <div class="editor-buttons">
            <button id="run">Run</button>
            <button id="step">Step</button>
        </div>
    </div> -->
    <div class="editor">

        <div class="code-editor">

            <pre id="highlightedCode"></pre>

            <textarea id="code" spellcheck="false" placeholder="Enter Zinx code"></textarea>

        </div>

        <div class="editor-buttons">
            <button id="run">Run</button>
            <button id="step">Step</button>
        </div>

    </div>

    <div class="panel output-panel">
        <h2>Output</h2>
        <pre id="output"></pre>
    </div>

    <div class="debug-panels">

        <div class="panel">
            <h2>Tokens</h2>
            <pre id="tokens"></pre>
        </div>

        <div class="panel">
            <h2>AST</h2>
            <pre id="ast"></pre>
        </div>

    </div>

    </div>

    <script type="module" src="./app.js"></script>

</body>

</html>
